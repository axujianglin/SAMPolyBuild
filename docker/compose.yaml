services:
  sampoly-auto-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: sampoly-auto-api:cu117
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SAMPOLY_AUTO_CONFIG: /app/configs/auto_whumix.py
      SAMPOLY_AUTO_CHECKPOINT: /app/checkpoints/auto_whumix.pth
      SAMPOLY_RUNTIME_ROOT: /app/runtime
      SAMPOLY_DEVICE: cuda
      SAMPOLY_GPU: "0"
      SAMPOLY_BATCH_SIZE: "1"
      SAMPOLY_NUM_WORKERS: "1"
      SAMPOLY_DEFAULT_SCORE_THRESHOLD: "0.1"
      SAMPOLY_MAX_UPLOAD_MB: "100"
      # Empty preserves the original host-only development behavior.
      SAMPOLY_API_KEY: ""
    volumes:
      - ../checkpoints:/app/checkpoints:ro
      - sampoly-runtime:/app/runtime
    shm_size: "4gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python3.10
        - -c
        - >-
          import json,sys,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'));
          sys.exit(0 if data.get('status') == 'ready' else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  sampoly-runtime:
